; 计算者-X 网关固件 —— ESP32-S3
;
; 【重要】家里这块板子有两个 USB 口，串口号会随插哪个口而变化：
;   · UART 口（CH343，VID 1A86）  → 之前是 COM3，走硬件串口 UART0
;   · 原生 USB 口（VID 303A）     → 现在是 COM5，走 USB-Serial/JTAG
; 下面开了 ARDUINO_USB_CDC_ON_BOOT=1，所以 **两个口都能收到日志**，插哪个都行。

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 端口留空 = PlatformIO 自动选（只有一个串口时最省事）
; 想写死就填，比如 upload_port = COM5
; upload_port = COM5
; monitor_port = COM5
upload_speed = 921600
monitor_speed = 115200

board_build.flash_size = 16MB
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DUSE_WIFI=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; 想启用 WiFi 就把 -DUSE_WIFI=0 改成 1，并补上这两行：
    ; -DWIFI_SSID=\"你的WiFi名\"
    ; -DWIFI_PASS=\"你的WiFi密码\"

build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17

monitor_filters = time, colorize
